known_limitations:
  - S3 wrapper fields are documented as observed transport fields unless Hyperliquid official docs define them directly.
  - Explorer numeric asset ids can be mapped with data/hyperliquid/reference/meta/asset_id_symbol_mapping_latest.csv, but that file is the latest API snapshot rather than a 2025-10-10 21:00 UTC historical meta snapshot.
  - Some misc_events variants are observed in this hour but not fully covered by official field-level docs.
